# The settings of the pipeline, see README.md.

# The rig: its rosbridge, which announces the finished angles and sessions, and
# StepIt Camera's web server, which serves its pictures folder.
[rig]
host = "stepit.local"
port = 9090            # The commander's rosbridge.
pictures_port = 8090   # StepIt Camera's web server: /pictures/ on it.

# Where the rig's pictures are copied, and every image of a session is saved:
# relative to the repo, or an absolute path.
[pictures]
mirror = "pictures"

# Every merged image is turned clockwise by this many degrees, 0, 90, 180 or
# 270: 0 keeps it as the sensor sees it, landscape. On the rig, the stage's
# turn moves the subject up and down in the sensor's picture; the Portrait
# shows its views from side to side, so the images are turned by 90.
[images]
rotate = 90

# The quilt for the Looking Glass Portrait: 8 x 6 views of 420 x 560 pixels.
# The views go from the last angle of the session to the first, which is right
# for the rig's stage. Set reverse to true if the depth looks inside out.
[quilt]
columns = 8
rows = 6
view_width = 420
view_height = 560
reverse = false

# StepIt Holo's server, which shows each quilt on the Looking Glass Portrait,
# on holo, the Raspberry Pi the Portrait is plugged into, on port 8095.
[display]
url = "http://holo.local:8095"
# While the rig shoots, show the quilt of the angles done so far: flat after
# the first angle, then its depth grows as the stage turns.
progress = true
